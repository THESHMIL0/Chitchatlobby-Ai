<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="bubbleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#ECFDF5" />
    </linearGradient>
    <linearGradient id="accentBubble" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#047857" flood-opacity="0.35"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#10B981" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Squircle App Badge Frame -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#bgGrad)" filter="url(#shadow)"/>
  
  <!-- Subtle Inner Shimmer Arc -->
  <path d="M 80 140 C 180 60, 332 60, 432 140" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" opacity="0.25"/>

  <!-- Secondary Back Chat Bubble -->
  <path d="M 280 170 C 350 170, 400 210, 400 270 C 400 300, 385 325, 360 342 C 365 365, 380 380, 395 390 C 365 390, 338 375, 320 360 C 307 366, 294 370, 280 370 C 210 370, 160 330, 160 270 C 160 210, 210 170, 280 170 Z" fill="url(#accentBubble)" opacity="0.85" />

  <!-- Primary Front Chat Bubble -->
  <path d="M 210 120 C 130 120, 80 165, 80 235 C 80 272, 98 303, 128 324 C 120 352, 100 372, 82 385 C 118 385, 152 368, 174 348 C 186 352, 198 355, 210 355 C 290 355, 340 310, 340 235 C 340 165, 290 120, 210 120 Z" fill="url(#bubbleGrad)" filter="url(#glow)"/>

  <!-- Typing Dots in Primary Bubble -->
  <circle cx="160" cy="235" r="16" fill="#059669"/>
  <circle cx="210" cy="235" r="16" fill="#10B981"/>
  <circle cx="260" cy="235" r="16" fill="#34D399"/>
</svg>
